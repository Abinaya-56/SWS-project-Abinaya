services:
  backend:
    build:
      context: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
      DATA_DIR: /app/data
    volumes:
      - document_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api-docs').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  document_data:
